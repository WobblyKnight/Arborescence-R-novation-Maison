/* ═══════════════════════════════════════════════════════════════
   STYLES — ne toucher que si tu veux changer l'apparence
   ═══════════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  background: #f8fafc;
  color: #1a1a2e;
  padding: 24px 16px;
}
.container { max-width: 880px; margin: 0 auto; }
h1 {
  font-size: 24px; font-weight: 700; margin-bottom: 4px;
  background: linear-gradient(135deg, #1e3a5f, #2563eb);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle { font-size: 13px; color: #64748b; margin-bottom: 16px; }
.toolbar {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px;
}
#search {
  flex: 1 1 220px; padding: 9px 14px; border-radius: 8px;
  border: 1px solid #e2e8f0; font-size: 13px; outline: none;
  background: #fff; font-family: inherit;
  transition: border-color 0.2s;
}
#search:focus { border-color: #2563eb; }
.btn-group { display: flex; gap: 4px; }
.btn {
  padding: 7px 14px; border-radius: 6px; border: 1px solid #e2e8f0;
  background: #fff; font-size: 12px; font-weight: 500; cursor: pointer;
  color: #475569; white-space: nowrap; font-family: inherit;
  transition: all 0.15s;
}
.btn:hover { background: #f1f5f9; border-color: #94a3b8; }
.tree-container {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
  padding: 12px 8px; max-height: 74vh; overflow-y: auto;
}
.node {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; margin: 1px 0; border-radius: 6px;
  cursor: pointer; transition: background 0.12s; user-select: none;
}
.node:hover { background: var(--hover-bg); }
.node.leaf { cursor: default; }
.node.match { background: var(--match-bg); }
.node-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 4px; font-size: 11px; font-weight: 700;
  transition: transform 0.2s;
}
.node-toggle.open { transform: rotate(90deg); }
.node-dot { width: 20px; text-align: center; font-size: 8px; }
.node-code {
  font-size: 11px; font-weight: 600; margin-right: 6px;
  font-family: 'JetBrains Mono', monospace;
}
.node-label { flex: 1; }
.node-count { font-size: 11px; color: #94a3b8; font-weight: 500; }
.children { margin-left: 20px; }
.children-line { border-left: 1px solid; margin-left: 19px; }

/* Depth styles */
.depth-0 .node-label { font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
.depth-1 .node-label { font-size: 14px; font-weight: 600; }
.depth-2 .node-label { font-size: 13px; font-weight: 500; }
.depth-3 .node-label { font-size: 12px; font-weight: 400; }

.hidden { display: none; }

/* Print */
@media print {
  body { padding: 0; }
  .toolbar, .btn-group { display: none !important; }
  .tree-container { max-height: none; border: none; box-shadow: none; }
}
</style>
</head>
<body>

<div class="container">
  <h1>Arbre des Travaux en Maison</h1>
  <p class="subtitle" id="stats"></p>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Rechercher un lot...">
    <div class="btn-group">
      <button class="btn" onclick="expandLevel(1)">Niveau 1</button>
      <button class="btn" onclick="expandLevel(2)">Niveau 2</button>
      <button class="btn" onclick="expandLevel(3)">Niveau 3</button>
      <button class="btn" onclick="expandAll()">Tout ouvrir</button>
      <button class="btn" onclick="collapseAll()">Tout fermer</button>
    </div>
  </div>

  <div class="tree-container" id="tree"></div>
</div>

/* ═══════════════════════════════════════════════════════════════════
   FIN DES DONNÉES — le reste c'est le moteur d'affichage,
   tu n'as normalement pas besoin d'y toucher
   ═══════════════════════════════════════════════════════════════════ */

const COLORS = [
  "#2563eb","#dc2626","#059669","#d97706","#7c3aed","#db2777","#0891b2","#65a30d",
  "#ea580c","#4f46e5","#0d9488","#b91c1c","#1d4ed8","#9333ea","#c026d3","#ca8a04",
  "#16a34a","#e11d48","#0284c7","#6d28d9","#be185d","#047857","#9a3412","#1e40af",
  "#7e22ce","#a21caf","#a16207","#15803d"
];

const expandedState = {};
let currentSearch = "";

function countNodes(node) {
  if (!node.children) return 1;
  return 1 + node.children.reduce((s, c) => s + countNodes(c), 0);
}

function nodeMatchesSearch(node, term) {
  if (!term) return true;
  if (node.lot.toLowerCase().includes(term)) return true;
  if (node.children) return node.children.some(c => nodeMatchesSearch(c, term));
  return false;
}

function renderNode(node, depth, parentColor) {
  const hasChildren = node.children && node.children.length > 0;
  const isOpen = expandedState[node.id];
  const color = depth === 0 ? COLORS[parseInt(node.id) % COLORS.length] : parentColor;
  const term = currentSearch.toLowerCase();

  if (term && !nodeMatchesSearch(node, term)) return "";

  const matchesSearch = term && node.lot.toLowerCase().includes(term);
  const depthClass = "depth-" + Math.min(depth, 3);
  const borderStyle = depth === 0
    ? `border-left: 3px solid ${color}`
    : `border-left: 2px solid ${color}30`;

  let html = `<div class="${depthClass}" style="margin-left: ${depth === 0 ? 0 : 20}px;">`;

  html += `<div class="node ${hasChildren ? '' : 'leaf'} ${matchesSearch ? 'match' : ''}"
    style="${borderStyle}; --hover-bg: ${color}10; --match-bg: ${color}18;"
    ${hasChildren ? `onclick="toggleNode('${node.id}')"` : ''}>`;

  if (hasChildren) {
    html += `<span class="node-toggle ${isOpen ? 'open' : ''}"
      style="background: ${color}15; color: ${color};">▶</span>`;
  } else {
    html += `<span class="node-dot" style="color: ${color}80;">●</span>`;
  }

  html += `<span class="node-label" style="color: ${depth === 0 ? color : '#1a1a2e'};">`;
  html += `<span class="node-code" style="color: ${color}99;">${node.id}</span>`;
  html += node.lot;
  html += `</span>`;

  if (hasChildren) {
    html += `<span class="node-count">${node.children.length}</span>`;
  }

  html += `</div>`;

  if (hasChildren && (isOpen || term)) {
    html += `<div class="children-line" style="border-color: ${color}20;">`;
    node.children.forEach(child => {
      html += renderNode(child, depth + 1, color);
    });
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function renderTree() {
  const container = document.getElementById("tree");
  let html = "";
  TREE_DATA.forEach(node => {
    html += renderNode(node, 0, null);
  });
  container.innerHTML = html;
}

function toggleNode(id) {
  expandedState[id] = !expandedState[id];
  renderTree();
}

function walkNodes(nodes, callback, depth) {
  nodes.forEach(n => {
    callback(n, depth);
    if (n.children) walkNodes(n.children, callback, depth + 1);
  });
}

function expandLevel(targetDepth) {
  // Reset all
  Object.keys(expandedState).forEach(k => delete expandedState[k]);
  walkNodes(TREE_DATA, (n, depth) => {
    if (n.children && depth < targetDepth) expandedState[n.id] = true;
  }, 0);
  renderTree();
}

function expandAll() {
  walkNodes(TREE_DATA, (n) => {
    if (n.children) expandedState[n.id] = true;
  }, 0);
  renderTree();
}

function collapseAll() {
  Object.keys(expandedState).forEach(k => delete expandedState[k]);
  renderTree();
}

// Init
document.addEventListener("DOMContentLoaded", () => {
  const total = TREE_DATA.reduce((s, n) => s + countNodes(n), 0);
  document.getElementById("stats").textContent =
    TREE_DATA.length + " lots principaux — " + total + " segments au total";

  document.getElementById("search").addEventListener("input", (e) => {
    currentSearch = e.target.value;
    renderTree();
  });

  renderTree();
});
</script>
